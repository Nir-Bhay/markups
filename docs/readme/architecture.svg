<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="320" viewBox="0 0 920 320" role="img" aria-labelledby="title desc">
  <title id="title">How a keystroke becomes preview</title>
  <desc id="desc">Monaco edits are debounced, parsed by Marked, sanitized with DOMPurify, and painted into the preview. Mermaid runs on a later frame, not on that first paint. A separate debounce writes the note locally.</desc>
  <rect width="920" height="320" fill="#0d1117" rx="12"/>
  <text x="28" y="36" fill="#e6edf3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">Production path in src/main.js</text>
  <text x="28" y="56" fill="#8b949e" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">Hosted app boots this file. The modular app.js entry is not what markups.dev loads.</text>
  <rect x="24" y="84" width="150" height="72" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="99" y="112" text-anchor="middle" fill="#e6edf3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">Monaco</text>
  <text x="99" y="132" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">Markdown model</text>
  <path d="M174 108 H206" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="206" y="84" width="150" height="72" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="281" y="112" text-anchor="middle" fill="#e6edf3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">300 ms</text>
  <text x="281" y="132" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">debouncedConvert</text>
  <path d="M356 120 H388" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="388" y="76" width="210" height="88" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="493" y="100" text-anchor="middle" fill="#e6edf3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">marked.parse</text>
  <text x="493" y="118" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">GFM default, alerts, emoji</text>
  <text x="493" y="136" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">KaTeX and Prism</text>
  <path d="M598 120 H630" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="630" y="84" width="130" height="72" rx="10" fill="#161b22" stroke="#d2a8ff" stroke-width="1.5"/>
  <text x="695" y="112" text-anchor="middle" fill="#e6edf3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">DOMPurify</text>
  <text x="695" y="132" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">then #output</text>
  <path d="M760 156 V196 H560" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="400" y="196" width="250" height="88" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="525" y="222" text-anchor="middle" fill="#e6edf3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">After paint</text>
  <text x="525" y="242" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">KaTeX nodes removed if toggle is off</text>
  <text x="525" y="260" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">mermaid.run after first paint</text>
  <path d="M99 156 V220 H24" stroke="#8b949e" stroke-width="1.5"/>
  <path d="M24 220 H148" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="148" y="196" width="220" height="88" rx="10" fill="#161b22" stroke="#f78166" stroke-width="1.5"/>
  <text x="258" y="222" text-anchor="middle" fill="#e6edf3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">1.5 s autosave</text>
  <text x="258" y="242" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">Dexie notes (markups_db)</text>
  <text x="258" y="260" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">localStorage docs copy</text>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#8b949e"/>
    </marker>
  </defs>
</svg>
