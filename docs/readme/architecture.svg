<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="220" viewBox="0 0 720 220" role="img" aria-labelledby="title desc">
  <title id="title">Markups edit to preview path</title>
  <desc id="desc">Monaco editor feeds Markdown through Marked, Mermaid, KaTeX, Prism, and DOMPurify into the live preview, then optional export.</desc>
  <rect width="720" height="220" fill="#0d1117" rx="12"/>
  <rect x="24" y="70" width="120" height="64" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="84" y="98" text-anchor="middle" fill="#e6edf3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">Monaco</text>
  <text x="84" y="116" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">Markdown</text>
  <path d="M152 102 H188" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="196" y="54" width="220" height="96" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="306" y="78" text-anchor="middle" fill="#e6edf3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">Render pipeline</text>
  <text x="306" y="98" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">Marked + GFM extensions</text>
  <text x="306" y="116" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">Mermaid · KaTeX · Prism</text>
  <text x="306" y="134" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">DOMPurify sanitize</text>
  <path d="M424 102 H460" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="468" y="70" width="110" height="64" rx="10" fill="#161b22" stroke="#d2a8ff" stroke-width="1.5"/>
  <text x="523" y="98" text-anchor="middle" fill="#e6edf3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">Preview</text>
  <text x="523" y="116" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">Live HTML</text>
  <path d="M523 142 V158 H640" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="580" y="168" width="116" height="36" rx="8" fill="#161b22" stroke="#f78166" stroke-width="1.5"/>
  <text x="638" y="191" text-anchor="middle" fill="#e6edf3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">Export</text>
  <text x="24" y="36" fill="#e6edf3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">Client-side path (no server render)</text>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#8b949e"/>
    </marker>
  </defs>
</svg>
