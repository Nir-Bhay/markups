name: Branch QA (no deployment)
on:
  push:
    branches: [growth/seo-geo-audit-2026-10, growth/discovery-review-2026-10-24]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: markups-branch-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/qa/check-seo-geo-static.mjs
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: node scripts/qa/verify-built-pages.mjs
      - run: node scripts/qa/audit-built-site.mjs
      - run: npx playwright install --with-deps chromium
      - name: Source-module media regressions (dev server required)
        run: npx playwright test tests/e2e/image-ir-update.spec.js tests/e2e/video-customize.spec.js
      - name: Test production build in Chromium
        run: npm run test:e2e
        env:
          PLAYWRIGHT_BUILT: '1'
      - name: Capture landing screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: markups-landing-responsive-screenshots
          path: |
            test-results/landing-screenshots/
            test-results/discovery-screenshots/
          if-no-files-found: ignore
          retention-days: 7
      - run: npm run build:modular
      - name: Smoke-test the actual modular build (core editing and routes)
        run: npx playwright test tests/e2e/modular-smoke.spec.js
        env:
          PLAYWRIGHT_BUILT: '1'
          MARKUPS_ENTRY: modular
      - name: Failure traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: markups-browser-test-failures
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 3
