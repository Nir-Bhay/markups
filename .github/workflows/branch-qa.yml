name: Branch QA (no deployment)
on:
  push:
    branches: [growth/seo-geo-audit-2026-10]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: markups-branch-qa
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/qa/check-seo-geo-static.mjs
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: node scripts/qa/verify-built-pages.mjs
      - run: node scripts/qa/audit-built-site.mjs
      - run: npm run build:modular
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Capture landing screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: markups-landing-responsive-screenshots
          path: test-results/landing-screenshots/
          if-no-files-found: ignore
          retention-days: 7
      - name: Failure traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: markups-browser-test-failures
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 3
