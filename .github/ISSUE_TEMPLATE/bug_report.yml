name: Bug report
description: Report a reproducible editor, export, or website problem
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Use disposable examples. Do not share credentials, private notes or share URLs. Report security issues using SECURITY.md."
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the route and a minimal non-sensitive Markdown example if relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, version and operating system
      placeholder: "Brave 1.x, Windows 11; hosted site or local build"
    validations:
      required: true
