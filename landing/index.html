<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F7F9FD" />
    <meta name="robots" content="index,follow,max-image-preview:large" />
    <meta name="description" content="A focused, free open-source Markdown editor for the browser. Write with live preview, code, math, diagrams, and media, then export or share when you choose." />
    <link rel="canonical" href="https://markups.dev/landing" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Markups" />
    <meta property="og:title" content="Markups — Write in Markdown. See the whole picture." />
    <meta property="og:description" content="A focused, free open-source Markdown editor for the browser. Write, preview, and export when you choose." />
    <meta property="og:url" content="https://markups.dev/landing" />
    <meta property="og:image" content="https://markups.dev/image/og-image.png" />
    <meta property="og:image:alt" content="Markups Markdown writing workspace" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Markups — Write in Markdown. See the whole picture." />
    <meta name="twitter:description" content="A focused, free open-source Markdown editor for the browser. No account needed to start writing." />
    <meta name="twitter:image" content="https://markups.dev/image/og-image.png" />
    <title>Markups — Write in Markdown. See the whole picture.</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebPage",
            "@id": "https://markups.dev/landing#page",
            "url": "https://markups.dev/landing",
            "name": "Markups — Write in Markdown. See the whole picture.",
            "description": "A focused, free open-source Markdown editor for the browser. Write, preview, and export when you choose.",
            "isPartOf": { "@id": "https://markups.dev/#website" },
            "about": { "@id": "https://markups.dev/#app" },
            "inLanguage": "en"
          },
          {
            "@type": "WebSite",
            "@id": "https://markups.dev/#website",
            "url": "https://markups.dev/",
            "name": "Markups"
          },
          {
            "@type": "WebApplication",
            "@id": "https://markups.dev/#app",
            "name": "Markups",
            "url": "https://markups.dev/",
            "applicationCategory": "ProductivityApplication",
            "operatingSystem": "Web browser",
            "description": "A free, open-source Markdown editor for writing, previewing, organizing, and exporting documents in the browser.",
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
            "license": "https://github.com/Nir-Bhay/markups/blob/main/LICENSE"
          },
          {
            "@type": "FAQPage",
            "@id": "https://markups.dev/landing#faq",
            "mainEntity": [
              { "@type": "Question", "name": "Is Markups free?", "acceptedAnswer": { "@type": "Answer", "text": "Yes. You can start writing in the browser without an account." } },
              { "@type": "Question", "name": "Where are my documents saved?", "acceptedAnswer": { "@type": "Answer", "text": "Local documents are saved in this browser. Export or share them when you choose." } },
              { "@type": "Question", "name": "Does Markups upload my document automatically?", "acceptedAnswer": { "@type": "Answer", "text": "No automatic Markups cloud backup is enabled in this build." } },
              { "@type": "Question", "name": "Can I share a document?", "acceptedAnswer": { "@type": "Answer", "text": "Yes. You can create a share link or share or download a Markdown file. Anyone with the link can read that document, so treat the link as the document." } },
              { "@type": "Question", "name": "Which export formats are available?", "acceptedAnswer": { "@type": "Answer", "text": "Markdown, image-based PDF, standalone HTML, plain text, PNG, print, and Word-compatible .doc." } },
              { "@type": "Question", "name": "Is the Word export a native .docx file?", "acceptedAnswer": { "@type": "Answer", "text": "No. It is Word-compatible HTML saved with a .doc extension, not a native OOXML .docx file." } },
              { "@type": "Question", "name": "Can I connect Drive or GitHub?", "acceptedAnswer": { "@type": "Answer", "text": "Drive and GitHub workflows exist in the source but are not configured or available to users in this build. When enabled, they are manual and require you to choose a file; they do not run background sync. Local editing does not require a provider connection." } },
              { "@type": "Question", "name": "How does the AI assistant work?", "acceptedAnswer": { "@type": "Answer", "text": "You configure a supported provider and your own key, then choose an action and the excerpt or document context to send. Requests go to that provider; they are not described as browser-only." } }
            ]
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <main>
        <h1>Write in Markdown. See the whole picture.</h1>
        <p>Markups is a free, open-source Markdown editor for the browser, with live preview, diagrams, math, and document exports.</p>
        <p>Interactive examples need JavaScript. You can still <a href="/">open the editor</a>.</p>
      </main>
    </noscript>
    <script type="module" src="/landing/src/main.tsx"></script>
  <script type="module" src="/src/editorialTelemetry.js"></script>
</body>
</html>
