services:
  markups:
    build:
      context: .
      dockerfile: Containerfile
    image: localhost/markups:${MARKUPS_TAG:-local}
    ports:
      - "${MARKUPS_PORT:-8080}:80"
    healthcheck:
      test:
        - CMD-SHELL
        - wget --no-verbose --tries=1 --spider http://127.0.0.1/index.html || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped